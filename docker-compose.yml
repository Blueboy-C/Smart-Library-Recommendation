services:
  mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: smartlib-mock
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - smartlib-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartlib-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///data/smart_library.db
      - LLM_API_KEY=${LLM_API_KEY:-6fb6bffa8c114e78ac4da3c72781b528.q90BoSiQil1ut5jA}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - LLM_MODEL=${LLM_MODEL:-GLM-4-Flash}
    volumes:
      - db_data:/app/data
    depends_on:
      mock:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smartlib-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartlib-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - smartlib-net

  # Data sync (one-shot, runs after backend is healthy)
  sync:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartlib-sync
    command: >
      sh -c "sleep 5 && curl -X POST http://backend:8000/api/admin/import/sync && echo 'Sync done'"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartlib-net

networks:
  smartlib-net:
    driver: bridge

volumes:
  db_data:
